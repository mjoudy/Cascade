name: cascade
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - pandas
  - scikit-learn
  - ipywidgets
  - h5py
  - jupyter
  - tqdm           # progress bars in the analysis pipeline
  - pip
  - pip:
      - nitime       # multitaper PSD used by the PSD-Lorentzian tau estimate
      - tensorflow   # Only if you plan to use the deep learning parts (upstream CASCADE) 